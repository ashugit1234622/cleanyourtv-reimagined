<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <radialGradient id="glow1" cx="30%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="75%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="16" fill="url(#glow1)"/>
  <rect width="1200" height="340" rx="16" fill="url(#glow2)"/>

  <!-- Subtle Frame Border -->
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top Badge: Apple TV Aesthetic -->
  <g transform="translate(600, 60)" filter="url(#shadow)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="url(#pillBorder)" stroke-width="1"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="2">PERSONAL CUSTOM FORK</text>
  </g>

  <!-- Main Title: CleanYourTV -->
  <text x="600" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    CleanYourTV <tspan fill="url(#accent)">Reimagined</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
    Apple TV Aesthetic · iOS-Style Motion · Xiaomi Hardware Control · Zero Bloat
  </text>

  <!-- Feature Pills -->
  <g transform="translate(600, 252)">
    <!-- Pill 1: iOS Motion -->
    <g transform="translate(-320, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">✨ iOS Open &amp; Close</text>
    </g>

    <!-- Pill 2: tvOS Recents -->
    <g transform="translate(-110, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">⚡ tvOS Recent Apps</text>
    </g>

    <!-- Pill 3: Live Picture & Audio -->
    <g transform="translate(110, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="18" fill="rgba(34, 197, 94, 0.1)" stroke="rgba(34, 197, 94, 0.3)" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#4ade80" text-anchor="middle">🎛️ Live Picture &amp; DTS Modes</text>
    </g>

    <!-- Pill 4: Phone Bridge -->
    <g transform="translate(325, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="rgba(251, 146, 60, 0.1)" stroke="rgba(251, 146, 60, 0.3)" stroke-width="1"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fb923c" text-anchor="middle">📱 Phone Bridge Web App</text>
    </g>
  </g>
</svg>
